services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: snackzar-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      - mysql
      - redis
    networks:
      - snackzar

  nginx:
    image: nginx:alpine
    container_name: snackzar-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - snackzar

  mysql:
    image: mysql:8.0
    container_name: snackzar-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: snackzar
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: snackzar
      MYSQL_PASSWORD: secret
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - snackzar

  redis:
    image: redis:7-alpine
    container_name: snackzar-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - snackzar

  horizon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: snackzar-horizon
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan horizon
    volumes:
      - .:/var/www
    depends_on:
      - app
      - redis
    networks:
      - snackzar

  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: snackzar-reverb
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080"
    volumes:
      - .:/var/www
    depends_on:
      - app
      - redis
    networks:
      - snackzar

volumes:
  mysql_data:
  redis_data:

networks:
  snackzar:
    driver: bridge
